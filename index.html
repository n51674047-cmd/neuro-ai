<title>NEURO AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090a12;color:#f5f5ff;font-family:Arial,sans-serif}
header{padding:20px;border-bottom:1px solid #292d43;font-size:24px;font-weight:bold;letter-spacing:2px}
header span{color:#9870ff}
main{max-width:850px;margin:auto;padding:30px 16px}
h1{font-size:30px}
.sub{color:#9298b0;line-height:1.5}
.box{background:#141725;border:1px solid #292d43;border-radius:16px;padding:20px;margin-top:25px}
label{display:block;margin:17px 0 9px;font-size:13px;font-weight:bold}
textarea,select{width:100%;background:#090c16;color:white;border:1px solid #30354b;border-radius:10px;padding:13px;font-size:15px}
textarea{height:130px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{cursor:pointer}
.generate{width:100%;margin-top:22px;padding:16px;border:0;border-radius:11px;background:linear-gradient(100deg,#7955e9,#a15cf0,#438de8);color:white;font-weight:bold}
.generate:disabled{opacity:.5}
#status{display:none;margin-top:16px;padding:14px;border-radius:10px;background:#211c37;line-height:1.6;font-size:13px}
#result img{width:100%;max-width:650px;border-radius:12px;margin-top:18px;display:block}
a{color:#c3aaff}
nav{display:flex;gap:10px;margin:20px 0}
nav button{background:#191d2d;border:1px solid #30354b;color:white;padding:11px 15px;border-radius:9px}
.page{display:none}
.page.active{display:block}
.card{background:#141725;border:1px solid #292d43;border-radius:13px;padding:17px;margin-top:12px}
.small{color:#9298b0;font-size:12px;line-height:1.6}
footer{text-align:center;color:#646b82;padding:30px;font-size:12px}
@media(max-width:500px){.grid{grid-template-columns:1fr}main{padding:22px 13px}}
</style>
</head>
